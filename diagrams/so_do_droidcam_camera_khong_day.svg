<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <defs>
    <style>
      .title{font:700 32px "Segoe UI",Arial,sans-serif;fill:#102033}
      .subtitle{font:400 17px "Segoe UI",Arial,sans-serif;fill:#5b6b80}
      .box-title{font:700 20px "Segoe UI",Arial,sans-serif;fill:#102033}
      .box-text{font:400 15px "Segoe UI",Arial,sans-serif;fill:#526173}
      .tag{font:700 13px "Segoe UI",Arial,sans-serif;fill:#ffffff}
      .arrow{stroke:#34495e;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .wifi{stroke:#1976a2;stroke-width:4;fill:none;stroke-linecap:round}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34495e"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eefaf4"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="720" fill="url(#bg)"/>
  <text x="550" y="58" text-anchor="middle" class="title">Sơ đồ sử dụng DroidCam làm camera không dây</text>
  <text x="550" y="88" text-anchor="middle" class="subtitle">Điện thoại truyền video qua WiFi, web server đọc bằng OpenCV rồi đưa vào pipeline AI</text>

  <g class="shadow">
    <rect x="80" y="165" width="220" height="330" rx="34" fill="#172033"/>
    <rect x="102" y="205" width="176" height="250" rx="18" fill="url(#phone)"/>
    <circle cx="190" cy="472" r="9" fill="#334155"/>
    <rect x="156" y="184" width="68" height="8" rx="4" fill="#334155"/>
  </g>
  <text x="190" y="260" text-anchor="middle" class="box-title">Điện thoại</text>
  <text x="190" y="289" text-anchor="middle" class="box-text">Cài DroidCam</text>
  <text x="190" y="318" text-anchor="middle" class="box-text">Đặt ở góc quan sát</text>
  <rect x="130" y="348" width="120" height="28" rx="14" fill="#16a34a"/>
  <text x="190" y="367" text-anchor="middle" class="tag">CAMERA</text>

  <path class="wifi" d="M360 260 C430 195,510 195,580 260"/>
  <path class="wifi" d="M402 302 C450 258,490 258,538 302"/>
  <path class="wifi" d="M445 344 C462 328,478 328,495 344"/>
  <circle cx="470" cy="380" r="9" fill="#1976a2"/>
  <text x="470" y="430" text-anchor="middle" class="box-title">WiFi nội bộ</text>
  <text x="470" y="456" text-anchor="middle" class="box-text">Truyền luồng video không dây</text>
  <path class="arrow" d="M300 330 C350 330,370 330,420 330"/>
  <path class="arrow" d="M520 330 C570 330,590 330,640 330"/>

  <g class="shadow">
    <rect x="640" y="205" width="340" height="92" rx="18" fill="#ffffff"/>
    <text x="810" y="240" text-anchor="middle" class="box-title">URL DroidCam</text>
    <text x="810" y="268" text-anchor="middle" class="box-text">http://IP-dien-thoai:4747/video</text>
  </g>
  <path class="arrow" d="M810 297 L810 355"/>

  <g class="shadow">
    <rect x="640" y="355" width="340" height="92" rx="18" fill="url(#server)"/>
    <text x="810" y="390" text-anchor="middle" class="box-title">Web server + OpenCV</text>
    <text x="810" y="418" text-anchor="middle" class="box-text">Đọc frame từ URL camera</text>
  </g>
  <path class="arrow" d="M810 447 L810 505"/>

  <g class="shadow">
    <rect x="640" y="505" width="340" height="100" rx="18" fill="url(#ai)"/>
    <text x="810" y="540" text-anchor="middle" class="box-title">Pipeline phát hiện té ngã</text>
    <text x="810" y="568" text-anchor="middle" class="box-text">YOLOv8 Pose -> GRU -> State machine</text>
  </g>

  <rect x="72" y="540" width="460" height="82" rx="18" fill="#ffffff" opacity="0.88" class="shadow"/>
  <text x="302" y="574" text-anchor="middle" class="box-title">Ý nghĩa trong đề tài</text>
  <text x="302" y="601" text-anchor="middle" class="box-text">Dùng điện thoại làm camera demo linh hoạt, không cần dây USB dài</text>
</svg>
