<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <defs>
    <style>
      .title{font:700 30px "Segoe UI",Arial,sans-serif;fill:#102033}
      .text{font:700 20px "Segoe UI",Arial,sans-serif;fill:#102033}
      .sub{font:400 15px "Segoe UI",Arial,sans-serif;fill:#526173}
      .label{font:700 15px "Segoe UI",Arial,sans-serif;fill:#334155}
      .conn{font:700 20px "Segoe UI",Arial,sans-serif;fill:#ffffff}
      .conntext{font:700 15px "Segoe UI",Arial,sans-serif;fill:#102033}
      .arrow{stroke:#34495e;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34495e"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#f4faf7"/>
  <text x="600" y="55" text-anchor="middle" class="title">Lưu đồ phát hiện té ngã - Phần 3: Quyết định và cảnh báo</text>

  <g class="shadow">
    <circle cx="600" cy="105" r="30" fill="#7c3aed"/>
    <text x="600" y="112" text-anchor="middle" class="conn">C</text>
  </g>
  <text x="670" y="112" class="conntext">Từ phần 2: đã đủ chuỗi đặc trưng</text>
  <path class="arrow" d="M600 135 L600 185"/>

  <g class="shadow">
    <rect x="305" y="185" width="590" height="88" rx="18" fill="#ede9fe"/>
    <text x="600" y="221" text-anchor="middle" class="text">Mô hình GRU dự đoán trạng thái</text>
    <text x="600" y="249" text-anchor="middle" class="sub">Nhận xác suất 8 lớp: NORMAL, SITTING, FALLING, FALLEN...</text>
  </g>
  <path class="arrow" d="M600 273 L600 323"/>

  <g class="shadow">
    <rect x="305" y="323" width="590" height="96" rx="18" fill="#ffe8b5"/>
    <text x="600" y="360" text-anchor="middle" class="text">State machine kiểm tra bằng chứng</text>
    <text x="600" y="388" text-anchor="middle" class="sub">Tốc độ rơi, tư thế nằm, giảm chiều cao, bất động, phục hồi</text>
  </g>
  <path class="arrow" d="M600 419 L600 468"/>

  <g class="shadow">
    <path d="M600 468 L785 555 L600 642 L415 555 Z" fill="#fff0c7"/>
    <text x="600" y="550" text-anchor="middle" class="text">Có trạng thái</text>
    <text x="600" y="578" text-anchor="middle" class="text">nguy hiểm?</text>
  </g>

  <path class="arrow" d="M415 555 L230 555"/>
  <text x="320" y="535" text-anchor="middle" class="label">Không</text>
  <g class="shadow">
    <circle cx="200" cy="555" r="30" fill="#2563eb"/>
    <text x="200" y="562" text-anchor="middle" class="conn">A</text>
  </g>
  <text x="200" y="602" text-anchor="middle" class="conntext">Quay lại phần 1</text>

  <path class="arrow" d="M785 555 L920 555"/>
  <text x="850" y="535" text-anchor="middle" class="label">Có</text>
  <g class="shadow">
    <rect x="920" y="508" width="210" height="94" rx="18" fill="#ffdfe5"/>
    <text x="1025" y="544" text-anchor="middle" class="text">Tạo cảnh báo</text>
    <text x="1025" y="572" text-anchor="middle" class="sub">Dashboard, Telegram</text>
    <text x="1025" y="594" text-anchor="middle" class="sub">ESP32 phát âm thanh</text>
  </g>
  <path class="arrow" d="M1025 602 L1025 705 L230 705"/>
  <g class="shadow">
    <circle cx="200" cy="705" r="30" fill="#2563eb"/>
    <text x="200" y="712" text-anchor="middle" class="conn">A</text>
  </g>
  <text x="425" y="690" text-anchor="middle" class="conntext">Sau cảnh báo: quay lại phần 1 để đọc frame mới</text>
</svg>
